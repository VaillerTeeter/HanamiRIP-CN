<!-- 文件：index.html | 用途：前端应用宿主页面，提供根挂载点并加载入口脚本 | 关键区域：head 元信息区、#app 挂载区、main.ts 脚本入口 -->
<!-- 声明文档类型为 HTML5，保证浏览器使用标准模式渲染页面。 -->
<!DOCTYPE html>
<!-- html 根节点，声明默认语言为简体中文，便于搜索引擎与辅助技术识别语言。 -->
<html lang="zh-CN">
    <!-- head 区域用于放置页面元信息与标题，不直接显示在页面正文中。 -->
    <head>
        <!-- 声明页面字符编码为 UTF-8，避免中文出现乱码。 -->
        <meta charset="UTF-8" />
        <!-- 设置视口参数，使页面在不同缩放与窗口尺寸下按预期布局。 -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- 设置浏览器标签页标题。 -->
        <title>HanamiRIP CN</title>
    </head>
    <!-- body 区域是页面可见内容容器，Vue 应用会挂载到其中。 -->
    <body>
        <!-- 作为 Vue 根实例挂载点，main.ts 会把 App 组件渲染到这里。 -->
        <div id="app"></div>
        <!-- 通过 ESM 方式加载前端入口脚本，启动 Vue 应用。 -->
        <script type="module" src="/main.ts"></script>
    </body>
</html>
